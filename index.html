<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVE 미션 노트</title>
<script data-goatcounter="https://ykk-30.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 좌측 미션 목록(검색·필터) + 우측 브리핑 카드. 카드 상단은 "출격 전 3초 요약"(탱킹/공격/블리츠/경고), 아래는 포켓별 웨이브 */
:root {
  --bg: #eef0f2;
  --panel: #ffffff;
  --sunk: #e4e7eb;
  --line: #cfd4da;
  --fg: #141a21;
  --muted: #5a6572;
  --accent: #a8641a;
  --accent-soft: #f4e6d4;
  --em: #2f78d6;
  --th: #d2502a;
  --ki: #6d7782;
  --ex: #b88a12;
  --ok: #2f8a4c;
  --warn: #b5541c;
  --bad: #c2353b;
  --font-display: "Chakra Petch", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1116; --panel: #151b22; --sunk: #1c242d; --line: #2a3440;
    --fg: #e3e8ee; --muted: #8b97a5; --accent: #e3a04f; --accent-soft: #2e2416;
    --em: #5ea2ff; --th: #ff7a52; --ki: #a7b1bc; --ex: #e8bb3d;
    --ok: #5cc27e; --warn: #f0894a; --bad: #ff6b6f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1116; --panel: #151b22; --sunk: #1c242d; --line: #2a3440;
  --fg: #e3e8ee; --muted: #8b97a5; --accent: #e3a04f; --accent-soft: #2e2416;
  --em: #5ea2ff; --th: #ff7a52; --ki: #a7b1bc; --ex: #e8bb3d;
  --ok: #5cc27e; --warn: #f0894a; --bad: #ff6b6f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; letter-spacing: .02em; margin: 0; line-height: 1.1; }
.top h1 span { color: var(--accent); }
.top .sub { color: var(--muted); font-size: .85rem; margin-top: 4px; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* Main grid */
.main { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }

/* Sidebar */
.side { display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 820px) { .side { position: static; } }
.search { position: relative; }
.search input {
  width: 100%; font: inherit; font-size: .95rem; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.item:focus-visible, .tbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-display); font-weight: 600; font-size: .82rem; letter-spacing: .04em;
  padding: 5px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.chip small { font-family: var(--font-mono); font-weight: 400; font-size: .7rem; margin-left: 4px; opacity: .8; }
.chip:hover:not(:disabled) { border-color: var(--accent); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.chip:disabled { opacity: .35; cursor: default; }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.list { display: grid; gap: 6px; max-height: calc(100vh - 220px); overflow-y: auto; padding-right: 2px; }
@media (max-width: 820px) { .list { max-height: none; } }
.item {
  text-align: left; font: inherit; color: inherit; cursor: pointer;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; background: var(--panel);
}
.item:hover { border-color: var(--line); }
.item[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.item .kr { font-weight: 600; min-width: 0; }
.item .en { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); grid-column: 1; min-width: 0; overflow-wrap: anywhere; }
.item .dots { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 3px; }
.dot { width: 8px; height: 22px; border-radius: 2px; }
.empty { color: var(--muted); font-size: .9rem; padding: 12px; }
.count { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }

/* Detail */
.detail { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
.head { display: grid; gap: 6px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.lvl { font-family: var(--font-display); font-weight: 700; color: var(--accent); letter-spacing: .08em; }
.head h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; margin: 0; line-height: 1.15; text-wrap: balance; }
.head .enname { font-family: var(--font-mono); color: var(--muted); font-size: .9rem; }
.status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: .72rem; font-weight: 600; letter-spacing: .04em; }
.status.unknown { background: var(--bad); color: var(--panel); }

/* Quick brief grid */
.brief { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .brief { grid-template-columns: minmax(0, 1fr); } }
.cell { background: var(--sunk); border-radius: 10px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.cell h3 { margin: 0; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); font-weight: 500; }
.cell p { margin: 0; }

.dmg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.d {
  border-radius: 6px; padding: 6px 4px; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: .85rem;
  border: 1px solid var(--line); color: var(--muted); opacity: .45; position: relative;
}
.d small { display: block; font-family: var(--font-mono); font-size: .65rem; font-weight: 500; }
.d.r1, .d.r2, .d.r0 { opacity: 1; color: var(--panel); border-color: transparent; }
.d.r2 { opacity: .72; }
.d.r0 { opacity: .85; }
.d.em.on { background: var(--em); } .d.th.on { background: var(--th); } .d.ki.on { background: var(--ki); } .d.ex.on { background: var(--ex); }
.dnote { font-size: .8rem; color: var(--muted); }

.blitz { border-left: 3px solid var(--accent); }
.blitz .verdict { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.v-yes { color: var(--ok); } .v-no { color: var(--bad); } .v-part { color: var(--warn); }

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .8rem; padding: 3px 9px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }
.tag.warn { border-color: var(--warn); color: var(--warn); }
.tag.bad { border-color: var(--bad); color: var(--bad); }
.tag.ok { border-color: var(--ok); color: var(--ok); }


/* Pockets */
.sec-title { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 0 0 10px; letter-spacing: .02em; }
.pocket { display: grid; gap: 8px; }
.pocket + .pocket { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
.pocket h4 { margin: 0; font-size: .95rem; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pocket h4 .pn { font-family: var(--font-mono); font-size: .72rem; color: var(--accent); letter-spacing: .08em; }
.pnote { font-size: .88rem; color: var(--muted); margin: 0; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-weight: 500; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
td .ship { font-family: var(--font-mono); font-size: .82rem; }
.flag { display: inline-block; font-size: .7rem; padding: 1px 6px; border-radius: 4px; margin: 2px 4px 0 0; font-weight: 600; white-space: nowrap; }
.flag.trig { background: var(--accent); color: var(--panel); }
.flag.target { background: var(--bad); color: var(--panel); }
.flag.ewar { border: 1px solid var(--warn); color: var(--warn); }
.flag.aggro { border: 1px solid var(--muted); color: var(--muted); }

ul.notes { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: .92rem; }
.sources { display: flex; flex-wrap: wrap; gap: 8px; font-size: .82rem; }
.sources a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; }
.foot { color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); padding-top: 12px; }

@media (prefers-reduced-motion: no-preference) {
  .detail { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
.tbl-wrap tr.sep td { font-size: .74rem; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: transparent; padding-top: 10px; border-bottom: 1px solid var(--line); }
.brief.nc { grid-template-columns: 1fr; }
.pocket td:nth-child(2) { white-space: nowrap; }
.brief .cell.wide { grid-column: 1 / -1; }
.sfac { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.sf { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; line-height: 1.4; color: #fff; background: #6b7280; }
.sf-amarr { background: #b8901c; color: #1d1600; }
.sf-caldari { background: #2f6fa8; }
.sf-gallente { background: #2c8a5a; }
.sf-minmatar { background: #a83a25; }
.sf-concord { background: #4b6a8c; }
.sf-ammatar { background: #7a5aa6; }
.sf-thukker { background: #b9661f; }
.sf-soe { background: #c23b3b; }
.sf-trig { background: #7d1a26; }
.sf-khanid { background: #8a5a2b; }
.sf-mordu { background: #5b6770; }
.sf-angel, .sf-blood, .sf-guristas, .sf-sansha, .sf-serpentis { background: transparent; color: inherit; box-shadow: inset 0 0 0 1px currentColor; opacity: .75; }
.sf-none { background: transparent; color: inherit; box-shadow: inset 0 0 0 1px currentColor; opacity: .6; font-weight: 500; }
.brief .cell.smajor { box-shadow: inset 4px 0 0 #c23b3b; }
</style>

<style>
/* 미션별 묶음: 목록은 미션 단위, 상세에서 레벨·팩션 판본을 선택 */
.lvs { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 3px; align-items: center; }
.lv { font-family: var(--font-mono); font-size: .68rem; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.lv.has { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.list { content-visibility: auto; }
.vars { display: flex; flex-wrap: wrap; gap: 6px; }
.var {
  font: inherit; font-size: .85rem; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  display: inline-flex; gap: 6px; align-items: baseline;
}
.var b { font-family: var(--font-display); font-weight: 700; color: var(--accent); }
.var .mark { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); align-self: center; }
.var[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.var:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.badge { font-size: .72rem; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.pending { display: grid; gap: 10px; }
.pending .verdict { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--muted); margin: 0; }
.pending p { margin: 0; }
.linkrow { display: flex; flex-wrap: wrap; gap: 8px; }
.linkrow a { font-size: .85rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; }
.linkrow a:hover { background: var(--accent-soft); }
.toggle { margin-left: auto; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>EVE 미션 <span>노트</span></h1>
      <div class="sub" id="stats"></div>
    </div>
    <div class="legend" aria-label="피해 속성 색상">
      <span><i style="background:var(--em)"></i>EM</span>
      <span><i style="background:var(--th)"></i>써멀</span>
      <span><i style="background:var(--ki)"></i>키네틱</span>
      <span><i style="background:var(--ex)"></i>폭발</span>
    </div>
  </header>

  <div class="main">
    <aside class="side">
      <div class="search">
        <label for="q" hidden>미션 검색</label>
        <input id="q" type="search" placeholder="미션명 (한국어·영문·초성)" autocomplete="off">
      </div>
      <div class="chips" id="levels" role="group" aria-label="레벨 선택"></div>
      <div class="chips">
        <button class="chip" type="button" id="onlyDone" aria-pressed="false">공략 있는 미션만</button>
      </div>
      <div class="count" id="count"></div>
      <nav class="list" id="list" aria-label="미션 목록"></nav>
    </aside>
    <main class="detail" id="detail" aria-live="polite"></main>
  </div>

  <div class="foot">위키 기록 기준이며, 게임 업데이트로 구성이 달라질 수 있습니다. 한국어 미션명은 미션리포트 검색 엔진 v0.96 시트 기준.</div>
</div>

<script>

const dkey = (m, v) => `${m.e}|${v[1]}|${v[0]}`;
const detailOf = (m, v) => DETAILS[dkey(m, v)] || (typeof AUTO !== "undefined" && AUTO[dkey(m, v)]) || null;
const hasDetail = m => m.v.some(v => detailOf(m, v));
const srcName = u => !u ? "" : u.includes("docs.google") ? "슬민 뉴비 가이드" : u.includes("funzinnu") ? "펀즈 위키 (한글)" : u.includes("eve-survival") ? "EVE-Survival" : "원문";

let state = { q: "", level: "all", done: false, id: null, vi: null };
try {
  const lv = localStorage.getItem("eve-missions-level");
  if (lv) state.level = lv === "all" ? "all" : Number(lv);
  state.done = localStorage.getItem("eve-missions-done") === "1";
  state.id = localStorage.getItem("eve-missions-last");
} catch (e) {}
if (location.hash.length > 1) state.id = location.hash.slice(1);

function visibleVariants(m) {
  return m.v.map((v, i) => [v, i]).filter(([v]) => state.level === "all" || v[0] === state.level);
}

const SFAC = {amarr: "아마르 제국", caldari: "칼다리 연합", gallente: "갈란테 연방", minmatar: "민마타 공화국", concord: "CONCORD", ammatar: "아마타 맨데이트", thukker: "써커 부족", soe: "SOE", trig: "트리글라비안", mordu: "모르두 리전", khanid: "카니드 왕국", angel: "엔젤 카르텔", blood: "블러드 레이더", guristas: "거리스타스", sansha: "산샤 네이션", serpentis: "서펜티스"};
const MAJOR = new Set(["amarr", "caldari", "gallente", "minmatar", "concord", "soe", "trig", "thukker", "ammatar", "khanid"]);
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const sortKey = m => m.k || m.e;
INDEX.sort((a, b) => {
  const ha = /^[가-힣]/.test(sortKey(a)), hb = /^[가-힣]/.test(sortKey(b));
  if (ha !== hb) return ha ? -1 : 1;
  return sortKey(a).localeCompare(sortKey(b), "ko");
});
function queryMatcher(q) {
  if (!/[ㄱ-ㅎ]/.test(q)) return t => t.includes(q);
  const src = [...q].map(c => {
    const i = CHO.indexOf(c);
    if (i < 0) return c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const a = String.fromCharCode(0xAC00 + i * 588), z = String.fromCharCode(0xAC00 + i * 588 + 587);
    return `[${c}${a}-${z}]`;
  }).join("");
  const re = new RegExp(src);
  return t => re.test(t);
}

function filtered() {
  const q = state.q.toLowerCase().replace(/\s+/g, "");
  const match = q ? queryMatcher(q) : null;
  return INDEX.filter(m => {
    if (state.level !== "all" && !m.v.some(v => v[0] === state.level)) return false;
    if (state.done && !visibleVariants(m).some(([v]) => detailOf(m, v))) return false;
    if (!match) return true;
    return match(m.k.replace(/\s+/g, "")) || match(m.e.toLowerCase().replace(/\s+/g, "")) || (m.a ? match(m.a.replace(/\s+/g, "")) : false);
  });
}

function pickVariant(m) {
  const vis = visibleVariants(m);
  if (state.vi !== null && vis.some(([, i]) => i === state.vi)) return state.vi;
  const withD = vis.find(([v]) => detailOf(m, v));
  return (withD || vis[0] || [null, 0])[1];
}

function dmgRow(map) {
  return '<div class="dmg">' + DMG.map(([k, label]) => {
    const has = Object.prototype.hasOwnProperty.call(map, k);
    const r = has ? map[k] : null;
    const sub = r === 1 ? "주" : r === 2 ? "부" : r === 0 ? "동급" : "";
    return `<div class="d ${k} ${has ? "on r" + r : ""}">${label}<small>${sub || "&nbsp;"}</small></div>`;
  }).join("") + "</div>" + (Object.keys(map || {}).length ? "" : '<p class="dnote">정보 없음</p>');
}

function renderStats() {
  const nv = INDEX.reduce((a, m) => a + m.v.length, 0);
  const nd = INDEX.reduce((a, m) => a + m.v.filter(v => detailOf(m, v)).length, 0);
  $("#stats").textContent = `미션 ${INDEX.length}개 · 판본 ${nv}개 · 공략 작성 ${nd}개`;
}

function renderLevels() {
  $("#levels").innerHTML = ["all", 1, 2, 3, 4, 5].map(l => {
    const n = l === "all" ? INDEX.length : INDEX.filter(m => m.v.some(v => v[0] === l)).length;
    return `<button class="chip" type="button" data-l="${l}" aria-pressed="${state.level === l}" ${n ? "" : "disabled"}>${l === "all" ? "전체" : "LV " + l}<small>${n}</small></button>`;
  }).join("");
  $("#onlyDone").setAttribute("aria-pressed", String(state.done));
}

function renderList() {
  const items = filtered();
  $("#count").textContent = `${items.length} / ${INDEX.length} 미션`;
  if (!items.length) {
    $("#list").innerHTML = '<div class="empty">조건에 맞는 미션이 없습니다. 검색어나 레벨을 바꿔 보십시오.</div>';
    return;
  }
  if (!items.some(m => m.id === state.id)) state.id = items[0].id;
  $("#list").innerHTML = items.map(m => {
    const lvset = new Set(m.v.map(v => v[0]));
    const dset = new Set(m.v.filter(v => detailOf(m, v)).map(v => v[0]));
    const lvs = [...lvset].sort().map(l => `<span class="lv ${dset.has(l) ? "has" : ""}" title="LV ${l}${dset.has(l) ? " 공략 있음" : ""}">${l}</span>`).join("");
    return `<button class="item" type="button" data-id="${m.id}" aria-current="${m.id === state.id}">
      <span class="kr">${esc(m.k || m.e)}</span>
      <span class="lvs" aria-hidden="true">${lvs}</span>
      <span class="en">${esc(m.e)}</span>
    </button>`;
  }).join("");
}

            <td class="n">${esc(r.n)}</td>
            <td>${esc(r.type)}</td>
            <td><span class="ship">${esc(r.ship)}</span></td>
            <td>${(r.flags || []).map(([t, s]) => `<span class="flag ${t}">${esc(s)}</span>`).join("")}</td>
          </tr>`).join("")}
        </tbody>
      </table></div>
    </div>`).join("");
}

function renderDetail() {
  const m = INDEX.find(x => x.id === state.id);
  if (!m) { $("#detail").innerHTML = ""; return; }
  const vi = pickVariant(m);
  const v = m.v[vi];
  const d = v ? detailOf(m, v) : null;
  const vis = visibleVariants(m);

  const chips = vis.map(([x, i]) => `
    <button class="var" type="button" data-vi="${i}" aria-pressed="${i === vi}">
      <b>L${x[0]}</b>${esc(facLabel(x[1]) || "공통")}${detailOf(m, x) ? '<span class="mark" title="공략 있음"></span>' : ""}
    </button>`).join("");

  let body;
  if (d) {
    const fk = d.factionKill;
    const bz = d.blitz === undefined ? ["v-part", "블리츠 정보 없음", ""] : d.blitz ? ["v-yes", "블리츠 가능", d.blitz] : ["v-no", "블리츠 불가", ""];
    const sd = STANDING[dkey(m, v)];
    const st = (sd && sd.t) || d.standing || "";
    const stNone = (sd && sd.n) || st === "없음" || (!(sd && sd.f && sd.f.length) && /없음/.test(st) && !/-\d|떨어|소폭|미미|있음|발생/.test(st));
    const stFac = !stNone && sd && sd.f ? sd.f : [];
    const stV = !st ? ["v-part", "정보 없음"] : stNone ? ["v-yes", "평판 손실 없음"] : ["v-no", "평판 손실 있음"];
    const facChips = stFac.length ? `<div class="sfac">${stFac.map(f => `<span class="sf sf-${f}">${SFAC[f] || f}</span>`).join("")}</div>` : (st && !stNone ? `<div class="sfac"><span class="sf sf-none">진영 미표기</span></div>` : "");
    const stCell = `<div class="cell wide${stFac.some(f => MAJOR.has(f)) ? " smajor" : ""}"><h3>평판 손실</h3><p class="verdict ${stV[0]}">${stV[1]}</p>${facChips}${st && st !== "없음" ? `<p>${esc(st)}</p>` : ""}</div>`;
    const notes = sd && sd.rm ? d.notes.filter(n => !sd.rm.includes(n)) : d.notes;
    const brief = d.nc ? `
    <section class="brief nc" aria-label="출격 전 요약">
      <div class="cell"><h3>전투</h3><p class="verdict">전투 없음</p>${d.ncNote ? `<p>${esc(d.ncNote)}</p>` : ""}</div>
      ${d.blitz ? `<div class="cell blitz"><h3>블리츠</h3><p class="verdict v-yes">블리츠 가능</p><p>${esc(d.blitz)}</p></div>` : ""}
      ${stCell}
    </section>` : `
    <section class="brief" aria-label="출격 전 요약">
      <div class="cell">
        <h3>탱킹 · 받는 피해</h3>
        ${dmgRow(d.tank)}
        ${d.tankNote ? `<p class="dnote">${esc(d.tankNote)}</p>` : ""}
      </div>
      <div class="cell">
        <h3>공격 · 유효 속성</h3>
        ${dmgRow(d.deal)}
        ${d.dealNote ? `<p class="dnote">${esc(d.dealNote)}</p>` : ""}
      </div>
      <div class="cell${d.blitz ? " blitz" : ""}">
        <h3>블리츠</h3>
        <p class="verdict ${bz[0]}">${bz[1]}</p>
        ${bz[2] ? `<p>${esc(bz[2])}</p>` : ""}
      </div>
      <div class="cell${fk ? " blitz" : ""}">
        <h3>팩션킬</h3>
        <p class="verdict ${fk ? "v-yes" : "v-no"}">${fk ? "팩션킬 있음" : "팩션킬 없음"}</p>
        ${fk ? `<p>${esc(fk)}</p>` : ""}
      </div>
      ${stCell}
    </section>`;
    body = `${brief}
    ${d.pockets.length ? `<section class="card">
      <h3 class="sec-title">구성과 트리거</h3>
      ${pocketsHtml(d)}
    </section>` : ""}
    <section class="card">
      <h3 class="sec-title">메모</h3>
      ${notes.length ? `<ul class="notes">${notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
      <div class="sources" style="margin-top:12px">${d.sources.map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`).join("")}</div>
    </section>`;
  } else {
    const links = [];
    if (v && v[2]) links.push(`<a href="${esc(v[2])}" target="_blank" rel="noopener">${srcName(v[2])}</a>`);
    if (m.b) links.push(`<a href="${esc(m.b)}" target="_blank" rel="noopener">블리츠 정보 (EVE-Survival)</a>`);
    body = `
    <section class="card pending">
      <p class="verdict">공략 미작성</p>
      ${v && v[3] ? `<p>${esc(v[3])}</p>` : ""}
      <div class="linkrow">${links.join("")}</div>
    </section>`;
  }

  $("#detail").innerHTML = `
    <section class="card head">
      <div class="eyebrow">
        <span class="lvl">LV ${v ? v[0] : "-"}</span>
        ${m.s ? '<span class="badge">스토리라인</span>' : ""}
      </div>
      <h2>${esc(m.k || m.e)}</h2>
      <div class="enname">${esc(m.e)}</div>
      ${vis.length > 1 ? `<div class="vars" role="group" aria-label="판본 선택" style="margin-top:8px">${chips}</div>` : ""}
    </section>
    ${body}`;
}

function persist() {
  try {
    localStorage.setItem("eve-missions-level", String(state.level));
    localStorage.setItem("eve-missions-done", state.done ? "1" : "0");
    if (state.id) localStorage.setItem("eve-missions-last", state.id);
  } catch (e) {}
  try { if (state.id) history.replaceState(null, "", "#" + state.id); } catch (e) {}
}

function renderAll() { renderLevels(); renderList(); renderDetail(); persist(); }

function select(id, scroll) {
  state.id = id; state.vi = null;
  renderList(); renderDetail(); persist();
  if (scroll && window.matchMedia("(max-width: 820px)").matches) {
    $("#detail").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

$("#list").addEventListener("click", e => {
  const b = e.target.closest(".item");
  if (b) select(b.dataset.id, true);
});
$("#detail").addEventListener("click", e => {
  const b = e.target.closest(".var");
  if (!b) return;
  state.vi = Number(b.dataset.vi);
  renderDetail();
});
$("#levels").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b || b.disabled) return;
  state.level = b.dataset.l === "all" ? "all" : Number(b.dataset.l);
  state.vi = null;
  renderAll();
});
$("#onlyDone").addEventListener("click", () => { state.done = !state.done; state.vi = null; renderAll(); });
$("#q").addEventListener("input", e => { state.q = e.target.value; renderList(); renderDetail(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); return; }
  if (e.target.tagName === "INPUT") return;
  if (!["ArrowDown", "ArrowUp", "j", "k"].includes(e.key)) return;
  const items = filtered(); const i = items.findIndex(m => m.id === state.id);
  const next = items[(i + ((e.key === "ArrowDown" || e.key === "j") ? 1 : -1) + items.length) % items.length];
  if (next) { e.preventDefault(); select(next.id, false); }
});

renderStats();
renderAll();
</script>

</html>
